name: astrbot_plugin_token_panel
display_name: PLUTO panel（普鲁托面板）
author: Charon
version: 1.3.1
desc: PLUTO panel（普鲁托面板）是会话上下文 Token 用量的可视化面板：进度条、预警阈值、自动播报与一键清空；内置上下文统计（/ctx）、上下文压缩与承接（/ctx_compress、/ctx_continue、/ctx_sessions、/ctx_switch），支持扩展功能内置页面视图与 /token_* 指令。
short_desc: PLUTO panel：Token 用量面板 + 上下文统计 / 压缩 / 承接
